# An example choreographd configuration: a merge queue on a few build machines, the service on its Unix
# socket. Whoever may open the socket (its group, see socket_mode) may call, naming its client in the
# `Choreograph-Client` header; a proxy in front (a mesh) carries the calls between machines. For TCP with TLS
# and tokens see config.tls.example.toml. Every key is described in the crate docs (choreographd::config).
# Durations are written like `1h30m` or as milliseconds.

listen = "/run/choreographd/api.sock"
socket_mode = "0660"
state_dir = "/var/lib/choreographd"

# Resources the build machines report, per node.
[[kind]]
name = "ram"
unit = "bytes"

[[kind]]
name = "cores"
unit = "millicores"

[[kind]]
name = "gate"   # test-gate slots

# One holder at a time per repository: a job names it (`"resource": "my-repo/main"`).
[[kind]]
name = "main"
shared = true

# Long work held until its holder releases it (an interactive session): no time limit, asked to give way
# for a more important job, and a pause keeps its memory but gives back its cores.
[[job_kind]]
name = "session"
open = true
preempt = "ask"
pause_keeps = ["ram"]
run = { p50 = "2h", p90 = "6h" }   # until releases of the kind have taught an estimate
# What a session may use under its lease: the holder hears at each level and decides; only a hard level
# with on_hard = "stop" ends it. A "step" budget begins again when the session restarts in place.
budgets = [
  { name = "context", scope = "step", soft = 150000, hard = 190000 },
  { name = "wall", meter = "wall", soft = "8h", hard = "12h", on_hard = "stop" },
]

# A build runs on the node that asked for it (its needs name that node). One that waited 30 minutes starts
# anyway, counted over the node's capacity, so a busy node cannot starve it; a person may say "start it now"
# with the job's own start_anyway_after = "0s".
[[job_kind]]
name = "build"
start_anyway_after = "30m"
allow_start_anyway = true

[policy]
aging_per_class = "1h"

[lease]
ttl = "1m"
on_expiry = "requeue"
pair_bounces = 6       # tells back and forth between two holders before the next is refused ("off": none)
pair_window = "10m"

[settings]
node_stale = "2m"
queued_stale = "3m"
max_wait = "60s"

# For a proxy in the same process that verifies its callers itself (choreographd::front): each caller it
# vouches for is a client by its principal, "NODE" for a machine or "NODE/USER" for a user on it, no token.
# A machine may report itself; a user only submits and keeps its own jobs.
# [[client]]
# name = "build-1"
# principal = "build-1"
# report = ["build-1"]
#
# [[client]]
# name = "build-1/alice"
# principal = "build-1/alice"
