[package]
name = "choreographd"
description = "The choreograph scheduler as a service: a JSON API over TLS for submitting jobs, leases and node reports"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# File::try_lock for the state directory lock
rust-version = "1.89"
keywords = ["scheduling", "merge-queue", "daemon", "leases"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "choreographd"
path = "src/main.rs"

[dependencies]
choreograph.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
clap.workspace = true
clap_complete = "4"
sha2.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service", "client-legacy"] }
http-body-util = "0.1"
bytes = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
# TLS without C: rustls on the pure-Rust graviola provider (no ring, no aws-lc)
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
