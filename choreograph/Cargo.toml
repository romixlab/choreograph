[package]
name = "choreograph"
description = "Plans and runs jobs over shared resources with priorities, deadlines, setup and cleanup"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["scheduling", "hil", "queueing", "merge-queue", "simulation"]
categories = ["algorithms", "simulation"]

[features]
default = ["toml"]
# The TOML job-set format (jobset.rs)
toml = ["dep:toml"]

[dependencies]
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml = { workspace = true, optional = true }
rand_core.workspace = true
rand_chacha.workspace = true
libm.workspace = true
