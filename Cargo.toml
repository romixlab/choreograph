[workspace]
resolver = "3"
members = ["choreograph", "choreograph_cli", "choreographd"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/romixlab/choreograph"
rust-version = "1.88"

[workspace.dependencies]
choreograph = { path = "choreograph" }
serde = { version = "1", features = ["derive"] }
# default features off: no asm, pure Rust
sha2 = { version = "0.11", default-features = false }
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["display", "parse", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
rand_core = "0.9"
rand_chacha = { version = "0.9", default-features = false }
libm = "0.2"
serde_json = "1"
# default features off: no fork/timeout machinery, no regex; a fixed seed in every test
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }

[profile.dev]
split-debuginfo = "unpacked"

[profile.test]
split-debuginfo = "unpacked"

# just install: release, but incremental so a rebuild after a small change is quick
[profile.deploy]
inherits = "release"
incremental = true
